<a class="skip-link" href="#main">דילוג לתוכן</a>

<!--
  Rendered outside the gate on purpose: a failed load is reported by exactly
  this banner, and hiding it behind a signed-in shell would hide the one case
  where the app has her session but not her records.
-->
<app-save-error />

@if (checkingSession()) {
  <div class="booting" role="status">רגע…</div>
} @else if (needsSignIn()) {
  <app-sign-in />
} @else {
  <div class="shell">
    <div class="column">
      <!-- The year decides everything below it. -->
      <!--
        One row from tablet up: tabs at the start, the year and search at the
        end, as a browser keeps its tabs and address bar together. On a phone
        there are no tabs, so the row holds just the year and search.
      -->
      <header class="topbar">
        <app-tab-strip class="tab-strip" />
        <app-course-switcher />
        <app-top-tools />
      </header>

      <main id="main" class="main" tabindex="-1">
        <router-outlet />
      </main>
    </div>

    <!-- Mobile only -->
    <nav class="tabbar" aria-label="ניווט ראשי">
      @for (item of primaryNav; track item.path) {
        <a
          class="tab"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          #rla="routerLinkActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          <app-icon [name]="item.icon" [size]="21" />
          <span>{{ item.label }}</span>
        </a>
      }
      <button
        type="button"
        class="tab"
        [class.is-active]="assistant.isOpen()"
        (click)="openAssistant()"
      >
        <app-icon name="sparkle" [size]="21" />
        <span>העוזר</span>
      </button>
      <button
        type="button"
        class="tab"
        [class.is-active]="moreOpen()"
        [attr.aria-expanded]="moreOpen()"
        (click)="toggleMore()"
      >
        <app-icon name="more" [size]="21" />
        <span>עוד</span>
      </button>
    </nav>

    @if (moreOpen()) {
      <div class="sheet-backdrop" (click)="closeMore()"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-label="עוד">
        <div class="sheet-grip" aria-hidden="true"></div>
        <ul class="sheet-list">
          <li class="sheet-row">
            <a class="sheet-link" routerLink="/settings" (click)="closeMore()">
              <app-icon name="more" [size]="20" />
              <span>הגדרות</span>
            </a>
          </li>
          @if (signedInAs(); as email) {
            <li class="sheet-account">
              <span class="sheet-email" dir="ltr">{{ email }}</span>
              <button type="button" class="sheet-signout" (click)="signOut()">התנתקות</button>
            </li>
          }
        </ul>
      </div>
    }

    <!-- The dynamic sidebar, on the middle of the right edge. Desktop only. -->
    <app-side-dock />
    <app-account-corner />

    <!-- The assistant, in the bottom-left corner. On a phone the bottom bar opens it. -->
    @if (!assistant.isOpen()) {
      <button
        type="button"
        class="assistant-launcher"
        aria-label="העוזר"
        title="העוזר"
        (click)="openAssistant()"
      >
        <app-icon name="sparkle" [size]="24" />
      </button>
    }

    <!-- Quick actions and the assistant: one copy each, opened from anywhere. -->
    <app-add-student />
    <app-add-course />
    <app-assistant-panel />
  </div>
}
